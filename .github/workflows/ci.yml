name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DomainNameApi.sln
      - name: Build
        run: dotnet build DomainNameApi.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DomainNameApi.sln --configuration Release --no-build --verbosity normal
      - name: Pack (dry run)
        run: dotnet pack src/DomainNameApi/DomainNameApi.csproj --configuration Release --no-build --output artifacts
